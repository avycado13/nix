name: update-flake-lock
on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * 1'

jobs:
  update-flake-lock:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
      - name: Add Magic nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.117.24.61

      - name: Configure xilo cache
        uses: stubbedev/xilo@v0
        with:
          url: https://cache.avyay.in
          cache: default/main
          token: ${{ secrets.XILO_TOKEN }}
      - name: Update flake.lock
        run: nix flake update
      - name: Commit flake.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet || git commit -m "chore(flake.lock): update"
          git push
      - name: Push realized outputs to cache
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            echo "Cache upload attempt ${attempt}/10"
            if nix-store --gc --print-live | xilo push default/main -; then
              echo "Cache upload succeeded"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep_time=$((2 ** attempt))
              echo "Upload failed, retrying in ${sleep_time}s..."
              sleep "$sleep_time"
            fi
          done
          echo "Cache upload failed after 5 attempts"
          exit 1
