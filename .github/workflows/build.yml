name: build and eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Evaluate flake
        run: |
          # Materialize evaluation dependencies (including Catppuccin's IFD)
          # before the no-build checker encounters them in a fresh store.
          # Force every system derivation; evaluating the outer attrset is lazy.
          nix eval --json .#nixosConfigurations --accept-flake-config \
            --apply 'builtins.mapAttrs (_: host: host.config.system.build.toplevel.drvPath)'
          nix eval --json .#darwinConfigurations --accept-flake-config \
            --apply 'builtins.mapAttrs (_: host: host.system.drvPath)'

          nix flake check --no-build . --accept-flake-config --all-systems --show-trace
  builds:
    runs-on: ${{ matrix.runner }}
    # needs: eval
    # timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
          - runner: ubuntu-24.04-arm
            system: aarch64-linux

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
      - name: Add Magic nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.72.166.0
      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://cache.avyay.in
      - name: "Install omnix"
        run: |
           nix profile install nixpkgs#omnix
      - name: Run om ci
        run: |
            om ci run \
              --extra-access-tokens ${{ secrets.GITHUB_TOKEN }} -d \
              -- --accept-flake-config
