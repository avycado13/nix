name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builds:
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
          - runner: ubuntu-24.04-arm
            system: aarch64-linux

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
      - name: Add Magic nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.117.24.61

      - name: Configure xilo cache
        uses: stubbedev/xilo@v0
        with:
          url: https://cache.avyay.in
          cache: default/main
          token: ${{ secrets.XILO_TOKEN }}
      - name: "Install omnix"
        run: |
           nix profile install nixpkgs#omnix
      - name: Run om ci
        run: |
            om ci run \
              --extra-access-tokens ${{ secrets.GITHUB_TOKEN }} -d \
              -- --accept-flake-config

      # Replace this with a more targeted command if xilo has one.
      - name: Push realized outputs to cache
        run: |
          nix-store --gc --print-live | xilo push default/main -
