name: build and eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Add Magic nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Evaluate flake
        run: |
          nix flake check --no-build . --accept-flake-config --all-systems

          nix eval .#packages.x86_64-linux --accept-flake-config
          nix eval .#packages.aarch64-linux --accept-flake-config
          nix eval .#packages.aarch64-darwin --accept-flake-config

          nix eval .#devShells.x86_64-linux --accept-flake-config
          nix eval .#devShells.aarch64-linux --accept-flake-config
          nix eval .#devShells.aarch64-darwin --accept-flake-config

          nix eval .#nixosConfigurations --accept-flake-config
          nix eval .#darwinConfigurations --accept-flake-config
  builds:
    runs-on: ${{ matrix.runner }}
    needs: eval
    # timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
          - runner: ubuntu-24.04-arm
            system: aarch64-linux

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
      - name: Add Magic nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.117.24.61

      - name: Configure niks3 cache
        run: |
          echo "extra-substituters = https://cache.avyay.in" | sudo tee -a /etc/nix/nix.conf
          echo "extra-trusted-public-keys = ${{ secrets.NIKS3_CACHE_PUBLIC_KEY }}" | sudo tee -a /etc/nix/nix.conf
      - name: "Install omnix"
        run: |
           nix profile install nixpkgs#omnix
      - name: Run om ci
        run: |
            om ci run \
              --extra-access-tokens ${{ secrets.GITHUB_TOKEN }} -d \
              -- --accept-flake-config

      - name: Push realized outputs to cache
        shell: bash
        env:
          NIKS3_SERVER_URL: https://cache.avyay.in
        run: |
          set -euo pipefail

          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "${{ secrets.NIKS3_API_TOKEN }}" > "$token_file"
          export NIKS3_AUTH_TOKEN_FILE="$token_file"

          mapfile -t paths < <(nix-store --gc --print-live)

          for attempt in {1..10}; do
            echo "Cache upload attempt ${attempt}/10"

            if nix run nixpkgs#niks3 -- push "${paths[@]}"; then
              echo "Cache upload succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep_time=$((2 ** attempt))
              echo "Upload failed, retrying in ${sleep_time}s..."
              sleep "$sleep_time"
            fi
          done

          echo "Cache upload failed after 5 attempts"
          exit 1
