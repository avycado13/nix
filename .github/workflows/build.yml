name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        
      - name: setup xilo for caching
        uses: stubbedev/xilo@v0
        with:
          url: https://cache.avyay.in
          cache: default/main
          token: ${{ secrets.XILO_TOKEN }}

      - name: Install omnix
        run: nix profile install nixpkgs#omnix

      - name: Run om ci
        run: |
          om ci run \
            --extra-access-tokens ${{ secrets.GITHUB_TOKEN }} \
            --systems "${{ matrix.system }}" \
            -- --accept-flake-config
      - name: Push to Cache
        run: xilo push default/main ./result
