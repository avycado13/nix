
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
      - id: set-matrix
        run: |
          set -euxo pipefail

          MATRIX="$(
            nix develop . \
              --accept-flake-config \
              --command om ci gh-matrix \
                --systems=x86_64-linux,aarch64-darwin,aarch64-linux \
            | jq -c '
                .include |= map(
                  . + {
                    runner: (
                      if .system == "x86_64-linux" then "ubuntu-latest"
                      elif .system == "aarch64-linux" then "ubuntu-24.04-arm"
                      elif .system == "aarch64-darwin" then "macos-15"
                      else error("unknown system: \(.system)")
                      end
                    )
                  }
                )
              '
          )"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: configure
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.117.24.61

      - name: Configure xilo cache
        uses: stubbedev/xilo@v0
        with:
          url: https://cache.avyay.in
          cache: default/main
          token: ${{ secrets.XILO_TOKEN }}

      - name: Build devshell
        run: |
          nix build --print-out-paths .#devShells.${{ matrix.system }}.default > devshell-path

      - name: Push devshell to cache
        continue-on-error: true
        run: |
          xilo push default/main "$(cat devshell-path)"

      - name: Run om ci
        run: |
          nix develop . --command \
            om ci run \
              --extra-access-tokens "github.com=${{ secrets.GITHUB_TOKEN }}" \
              --systems "${{ matrix.system }}" \
              ".#default.${{ matrix.subflake }}" \
              -- --accept-flake-config

      # Replace this with a more targeted command if xilo has one.
      - name: Push realized outputs to cache
        if: success()
        run: |
          nix-store --gc --print-live | xilo push default/main -
